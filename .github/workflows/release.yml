name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.2.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish GitHub release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore ZephyrusKeyboardBattery.sln

      - name: Build
        run: dotnet build ZephyrusKeyboardBattery.sln --configuration Release --no-restore

      - name: Publish self-contained win-x64 exe
        run: >-
          dotnet publish src/ZephyrusKeyboardBattery/ZephyrusKeyboardBattery.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:PublishTrimmed=false
          --output artifacts/win-x64

      - name: Package binary archive
        shell: pwsh
        run: Compress-Archive -Path artifacts/win-x64/* -DestinationPath BluetoothBatteryTray-win-x64.zip -Force

      - name: Resolve tag
        id: tag
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            "value=${{ inputs.tag }}" >> $env:GITHUB_OUTPUT
          } else {
            "value=${{ github.ref_name }}" >> $env:GITHUB_OUTPUT
          }

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: Bluetooth Battery Tray ${{ steps.tag.outputs.value }}
          generate_release_notes: true
          files: BluetoothBatteryTray-win-x64.zip
