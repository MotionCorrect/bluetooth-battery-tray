name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.2.0
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Build, sign, and publish GitHub release
    runs-on: windows-latest
    environment: signing

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore ZephyrusKeyboardBattery.sln

      - name: Build
        run: dotnet build ZephyrusKeyboardBattery.sln --configuration Release --no-restore

      - name: Publish self-contained win-x64 exe
        run: >-
          dotnet publish src/ZephyrusKeyboardBattery/ZephyrusKeyboardBattery.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:PublishTrimmed=false
          --output artifacts/win-x64

      # --- Windows: Azure Artifact Signing (formerly Trusted Signing) -----
      # Mirrors the MotionCorrect/ImageCompare Windows signing configuration.
      - name: Azure Login (OIDC - Windows)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign executable with Azure Artifact Signing (Windows)
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: MCArtifactSigningAccount
          certificate-profile-name: MCAppSigningProfile
          files-folder: ${{ github.workspace }}\artifacts\win-x64
          files-folder-filter: "*.exe"
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify Authenticode signature
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "artifacts/win-x64/BluetoothBatteryTray.exe"
          $sig = Get-AuthenticodeSignature $exe
          $sig | Format-List Status, StatusMessage, SignerCertificate
          if ($sig.Status -ne 'Valid') {
            throw "Authenticode signature is not valid: $($sig.Status) $($sig.StatusMessage)"
          }

      - name: Package binary archive
        shell: pwsh
        run: Compress-Archive -Path artifacts/win-x64/* -DestinationPath BluetoothBatteryTray-win-x64.zip -Force

      - name: Resolve tag
        id: tag
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            "value=${{ inputs.tag }}" >> $env:GITHUB_OUTPUT
          } else {
            "value=${{ github.ref_name }}" >> $env:GITHUB_OUTPUT
          }

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: Bluetooth Battery Tray ${{ steps.tag.outputs.value }}
          generate_release_notes: true
          files: BluetoothBatteryTray-win-x64.zip
