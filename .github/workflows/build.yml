name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build Windows tray app
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore ZephyrusKeyboardBattery.sln

      - name: Build
        run: dotnet build ZephyrusKeyboardBattery.sln --configuration Release --no-restore

      - name: Publish self-contained win-x64 exe
        run: >-
          dotnet publish src/ZephyrusKeyboardBattery/ZephyrusKeyboardBattery.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:PublishTrimmed=false
          --output artifacts/win-x64

      # --- Windows: Azure Artifact Signing (formerly Trusted Signing) -----
      # Mirrors the MotionCorrect/ImageCompare Windows signing configuration.
      - name: Azure Login (OIDC - Windows)
        if: github.event_name != 'pull_request'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign executable with Azure Artifact Signing (Windows)
        if: github.event_name != 'pull_request'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: MCArtifactSigningAccount
          certificate-profile-name: MCAppSigningProfile
          files-folder: ${{ github.workspace }}\artifacts\win-x64
          files-folder-filter: "*.exe"
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify Authenticode signature
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "artifacts/win-x64/BluetoothBatteryTray.exe"
          $sig = Get-AuthenticodeSignature $exe
          $sig | Format-List Status, StatusMessage, SignerCertificate
          if ($sig.Status -ne 'Valid') {
            throw "Authenticode signature is not valid: $($sig.Status) $($sig.StatusMessage)"
          }

      - name: Package artifact
        shell: pwsh
        run: Compress-Archive -Path artifacts/win-x64/* -DestinationPath BluetoothBatteryTray-win-x64.zip -Force

      - name: Upload published executable
        uses: actions/upload-artifact@v4
        with:
          name: BluetoothBatteryTray-win-x64
          path: BluetoothBatteryTray-win-x64.zip
