name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Windows tray app
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore ZephyrusKeyboardBattery.sln

      - name: Build
        run: dotnet build ZephyrusKeyboardBattery.sln --configuration Release --no-restore

      - name: Publish self-contained win-x64 exe
        run: >-
          dotnet publish src/ZephyrusKeyboardBattery/ZephyrusKeyboardBattery.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:PublishTrimmed=false
          --output artifacts/win-x64

      - name: Upload published executable
        uses: actions/upload-artifact@v4
        with:
          name: ZephyrusKeyboardBattery-win-x64
          path: artifacts/win-x64/
